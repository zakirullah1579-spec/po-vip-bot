services:
  - type: web
    name: pocket-option-vip-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: POCKET_OPTION_REG_LINK
        sync: false
    plan: free