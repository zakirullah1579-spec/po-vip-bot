name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          POCKET_OPTION_REG_LINK: ${{ secrets.POCKET_OPTION_REG_LINK }}
        run: |
          # Check if service already exists
          SERVICES=$(curl -s "https://api.render.com/v1/services" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY")
          
          SERVICE_ID=$(echo "$SERVICES" | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              for item in data:
                  if item.get('service', {}).get('name') == 'po-vip-signal-bot':
                      print(item['service']['id'])
                      break
          except:
              pass
          " 2>/dev/null || true)
          
          if [ -n "$SERVICE_ID" ]; then
            echo "Service exists ($SERVICE_ID). Triggering manual deploy..."
            curl -s -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -d '{"clearCaches": true}'
            echo "Deploy triggered!"
          else
            echo "Creating new service on Render..."
            PAYLOAD=$(cat <<JSONEOF
          {
            "ownerId": "$RENDER_OWNER_ID",
            "type": "web_service",
            "name": "po-vip-signal-bot",
            "repo": "https://github.com/zakirullah1579-spec/po-vip-bot",
            "branch": "main",
            "serviceDetails": {
              "env": "python",
              "plan": "free",
              "region": "oregon",
              "numInstances": 1,
              "healthCheckPath": "/",
              "envSpecificDetails": {
                "nativeEnvironmentDetails": {
                  "buildCommand": "pip install -r requirements.txt",
                  "startCommand": "python bot_web.py"
                }
              }
            },
            "envVars": [
              {"key": "BOT_TOKEN", "value": "$BOT_TOKEN"},
              {"key": "ADMIN_ID", "value": "$ADMIN_ID"},
              {"key": "POCKET_OPTION_REG_LINK", "value": "$POCKET_OPTION_REG_LINK"}
            ]
          }
JSONEOF
          )
            RESULT=$(curl -s -w "\n%{http_code}" -X POST "https://api.render.com/v1/services" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -d "$PAYLOAD")
            
            HTTP_CODE=$(echo "$RESULT" | tail -1)
            BODY=$(echo "$RESULT" | head -n -1)
            
            if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Service created successfully!"
            else
              echo "❌ Failed: HTTP $HTTP_CODE - $BODY"
              echo "Please deploy manually: https://render.com/deploy?repo=https://github.com/zakirullah1579-spec/po-vip-bot"
            fi
          fi
